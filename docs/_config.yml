title: LogPSplinePSD · LISA case studies
author: NZ Gravity
copyright: "2026"
exclude_patterns: [_build, Thumbs.db, .DS_Store, "**.ipynb_checkpoints", link_from_library.md]
only_build_toc_files: true
logo: _static/logo.png

execute:
  execute_notebooks: "off"

html:
  use_repository_button: true
  use_issues_button: true
  use_multitoc_numbering: false
  home_page_in_navbar: true
  favicon: _static/favicon.png

repository:
  url: https://github.com/nz-gravity/logpsplines_lisa_case_studies
  path_to_book: docs
  branch: main

sphinx:
  config:
    html_baseurl: https://nz-gravity.github.io/logpsplines_lisa_case_studies/
    html_theme_options:
      home_page_in_toc: true
      article_header_start: [toggle-primary-sidebar, library-link]
    templates_path: [_templates]
    html_css_files: [case-studies.css]
