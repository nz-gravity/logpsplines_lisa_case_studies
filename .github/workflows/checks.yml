name: Scientific checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scientific-checks:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --extra gapped
      - run: uv run --extra gapped pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --extra gapped lisa-demo-gaps --quick --output outputs/ci_seven_day
